<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="nav">
      <div class="logo">미림 동아리 홍보</div>
      <nav class="nav_sign">
        <a href="sign_in.html" class="login">로그인</a>
        <a href="sign_up.html" class="logup">회원가입</a>
      </nav>
    </header>
    <main>
      <div class="sign_box1">
        <p class="sign_text">로그인</p>
        <div>
          <p class="up_t2">아이디</p>
          <input
            type="text"
            placeholder="아이디를 입력해주세요"
            class="input"
          />
        </div>
        <div>
          <p class="up_t2">비밀번호</p>
          <input
            type="password"
            placeholder="비밀번호를 입력해주세요"
            class="input"
          />
        </div>
        <button class="ga">로그인</button>
        <div class="check">
          <span class="check_t1">계정이 없으신가요?</span
          ><a href="sign_up.html" class="check_login">회원가입</a>
        </div>
      </div>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
